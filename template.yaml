AWSTemplateFormatVersion: "2010-09-09"
Description: >
  kagerou ECS demo environment — one Fargate task with three containers
  (gateway / api / worker) behind the shared ALB. Only gateway is exposed.

# アプリに届けたい値は Env<Key>(kagerou CONTRACT §4)。
# 共有 ALB 側の値は --param で渡す(ベースの SSM Outputs を workflow が写す)。
Parameters:
  EnvKagerouEnv:
    Type: String
  EnvKagerouUrl:
    Type: String
    Default: ""
  ImageUri:
    Type: String
  ListenerArn:
    Type: String
  ClusterName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  TaskSecurityGroup:
    Type: String
  HostName:
    Type: String
    Description: Host header this environment answers to (pr-42.ecs.example.com)
  RulePriority:
    Type: Number
    Description: >
      Listener rule priority. Must be unique on the shared listener, so it is
      derived deterministically from the environment name by CI (see workflow).

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/kagerou/${EnvKagerouEnv}"
      RetentionInDays: 3

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "kagerou-${EnvKagerouEnv}"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      Volumes:
        - Name: shared
      ContainerDefinitions:
        # 同じイメージを command で使い分ける(push は 1 回で済む)
        - Name: gateway
          Image: !Ref ImageUri
          Command: ["/gateway"]
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: KAGEROU_ENV
              Value: !Ref EnvKagerouEnv
            - Name: KAGEROU_URL
              Value: !Ref EnvKagerouUrl
            - Name: API_URL
              Value: http://127.0.0.1:8081 # 同一タスク = localhost で届く
            - Name: SHARED_DIR
              Value: /shared
          MountPoints:
            - SourceVolume: shared
              ContainerPath: /shared
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway
        - Name: api
          Image: !Ref ImageUri
          Command: ["/api"]
          Environment:
            - Name: KAGEROU_ENV
              Value: !Ref EnvKagerouEnv
            - Name: PORT
              Value: "8081"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
        - Name: worker
          Image: !Ref ImageUri
          Command: ["/worker"]
          Environment:
            - Name: KAGEROU_ENV
              Value: !Ref EnvKagerouEnv
            - Name: SHARED_DIR
              Value: /shared
          MountPoints:
            - SourceVolume: shared
              ContainerPath: /shared
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      # 環境は消えるので、抜くのを待たない(down を速くする)
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "5"

  # 共有リスナーに自分のホスト名だけを横取りするルールを足す。
  # ALB 本体は触らない(= 他の環境に影響しない)
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Ref RulePriority
      Conditions:
        - Field: host-header
          Values: [!Ref HostName]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # NAT を立てない(プレビューにその固定費は重い)
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  KagerouUrl:
    Value: !Sub "https://${HostName}"
  ServiceName:
    Value: !GetAtt Service.Name
